<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista do mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#18231F; --muted:#5B6B64; --line:#D5DED9;
  --brand:#17663F; --brand-ink:#FFFFFF; --soft:#E2EAE5; --warn:#B45309; --over:#B42318;
  --shadow:0 1px 0 rgba(24,35,31,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --surface:#18201D; --ink:#E7EEEA; --muted:#93A39B; --line:#2A3631;
    --brand:#3FBF7A; --brand-ink:#0B1A12; --soft:#22302A; --warn:#F59E0B; --over:#F87171;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --ink:#E7EEEA; --muted:#93A39B; --line:#2A3631;
  --brand:#3FBF7A; --brand-ink:#0B1A12; --soft:#22302A; --warn:#F59E0B; --over:#F87171;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 150px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
h1{font:700 2.2rem/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.ghost:hover{background:var(--soft)}

.notice{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:14px;color:var(--muted)}
.notice[hidden]{display:none}

form.add{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;grid-template-columns:1fr 1fr;box-shadow:var(--shadow)}
form.add .name{grid-column:1/-1}
form.add input,form.add select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:1rem}
form.add .row{display:grid;grid-template-columns:72px 1fr;gap:8px;grid-column:1/-1}
@media (min-width:520px){
  form.add{grid-template-columns:1fr 180px}
  form.add .name{grid-column:1}
  form.add .row{grid-column:1/-1;grid-template-columns:90px 1fr auto}
}
.primary{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;grid-column:1/-1}
@media (min-width:520px){.row .primary{grid-column:auto}}

.filters{display:flex;gap:6px;margin:18px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Placas de corredor: o elemento marcante */
.aisle{margin-top:18px}
.sign{display:flex;align-items:baseline;justify-content:space-between;background:var(--c);color:#fff;border-radius:8px 8px 0 0;padding:6px 12px 5px}
.sign h2{margin:0;font:700 1.35rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.4px}
.sign span{font:600 1rem "Barlow Condensed","Arial Narrow",sans-serif;opacity:.92}
.shelf{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;padding:8px 10px 8px 6px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;padding:0}
.check i{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.item.done .check i{background:var(--brand);border-color:var(--brand)}
.check svg{width:15px;height:15px;opacity:0}
.item.done .check svg{opacity:1}
.info{min-width:0;cursor:pointer}
.info b{font-weight:600;display:block;overflow-wrap:anywhere}
.item.done .info b{text-decoration:line-through;color:var(--muted)}
.meta{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:5px;color:var(--brand);font-weight:500}
.who img{width:18px;height:18px;border-radius:50%}
.src{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin:0 0 12px}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:6px 0 10px;margin:0 0 6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 6px 0 12px}
.search:focus-within{border-color:var(--brand)}
.search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:1rem;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search button{border:0;background:none;width:36px;height:36px;border-radius:8px;font-size:1.3rem;color:var(--muted);cursor:pointer}
.search button[hidden]{display:none}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.tab{flex:1;border:0;background:none;padding:9px 10px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.basebar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.basebar .spent{font-size:1.6rem}
.note{font-size:.85rem;color:var(--muted);margin:6px 2px 14px}
.brow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:9px 10px 9px 12px;border-top:1px solid var(--line);align-items:center}
.brow:first-child{border-top:0}
.brow .info{cursor:default}
.bctrl{display:flex;gap:6px;align-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;width:30px;height:32px;cursor:pointer;font-size:1.1rem}
.qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.addone{border:1px solid var(--brand);color:var(--brand);background:none;border-radius:8px;height:32px;padding:0 10px;cursor:pointer;font-weight:600;white-space:nowrap}
.addone[disabled]{border-color:var(--line);color:var(--muted);cursor:default}
@media (max-width:460px){.brow{grid-template-columns:1fr}.bctrl{justify-content:flex-end}}
.right{display:flex;align-items:center;gap:2px}
.price{border:1px dashed var(--line);background:none;border-radius:8px;padding:5px 8px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600;min-width:74px;text-align:right}
.price.empty{color:var(--muted);font-weight:400}
.price-in{width:84px;border:1px solid var(--brand);border-radius:8px;padding:5px 8px;text-align:right;background:var(--bg)}
.del{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1.2rem;line-height:1}
.del:hover{background:var(--soft);color:var(--over)}

.empty-state{text-align:center;color:var(--muted);padding:36px 12px}
.empty-state strong{display:block;color:var(--ink);font:700 1.4rem "Barlow Condensed",sans-serif;margin-bottom:4px}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}

/* Barra do orçamento */
.budget{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.budget .in{max-width:640px;margin:0 auto}
.btop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.spent{font:700 1.7rem/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.of{color:var(--muted);font-size:.95rem}
.bar{height:8px;border-radius:99px;background:var(--soft);margin:8px 0 6px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:99px;transition:width .3s}
.bar .plan{position:absolute;top:0;bottom:0;width:2px;background:var(--muted)}
.budget.warn .fill{background:var(--warn)}
.budget.over .fill{background:var(--over)}
.budget.over .spent{color:var(--over)}
.bfoot{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);gap:10px}
.bfoot b{color:var(--ink);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:18px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px;font:700 1.5rem "Barlow Condensed",sans-serif}
dialog label{display:block;font-size:.9rem;color:var(--muted);margin:10px 0 4px}
dialog input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:24px;z-index:20}
.login[hidden]{display:none}
.login-card{max-width:360px;width:100%;text-align:center}
.login-card p{color:var(--muted)}
.login-card input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:1rem;margin-top:4px}
.login-card .primary{width:100%;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Lista do mercado</h1>
      <div class="sub" id="progress">Carregando…</div>
    </div>
    <button class="ghost" id="openSettings" type="button">Orçamento</button>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" type="button" data-tab="compra" aria-selected="true">Compra de hoje</button>
    <button class="tab" role="tab" type="button" data-tab="base" aria-selected="false">Lista base</button>
  </div>

  <div class="searchbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      <input id="q" type="search" placeholder="Procurar na compra de hoje" aria-label="Procurar item" autocomplete="off" enterkeyhint="search">
      <button type="button" id="qClear" aria-label="Limpar busca" hidden>×</button>
    </label>
  </div>

  <div id="tabCompra">

  <form class="add" id="addForm" autocomplete="off">
    <input class="name" id="fName" placeholder="O que falta? Ex.: detergente" required maxlength="80" aria-label="Nome do item" list="known">
    <datalist id="known"></datalist>
    <select id="fSector" aria-label="Setor"></select>
    <div class="row">
      <input id="fQty" type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="Quantidade">
      <input id="fPrice" inputmode="decimal" placeholder="Preço un. (R$)" aria-label="Preço unitário estimado">
      <button class="primary" type="submit">Adicionar</button>
    </div>
  </form>

  <div class="filters" role="group" aria-label="Filtro">
    <button class="chip" type="button" data-f="all" aria-pressed="true">Todos</button>
    <button class="chip" type="button" data-f="todo" aria-pressed="false">Faltando</button>
  </div>

  <div id="list"></div>

  <div class="tools" id="tools">
    <button class="ghost" type="button" id="fillPrices">Preencher preços de referência</button>
    <button class="ghost" type="button" id="clearDone">Remover itens já pegos</button>
    <button class="ghost" type="button" id="resetAll">Desmarcar tudo</button>
  </div>
  </div>

  <div id="tabBase" hidden>
    <div class="basebar">
      <div><div class="spent" id="baseTotal">R$ 0,00</div><div class="of" id="baseCount"></div></div>
      <button class="primary" type="button" id="addAllBase" style="grid-column:auto">Adicionar tudo à compra</button>
    </div>
    <p class="note">Preços estimados. Toque no preço para corrigir: o valor novo fica salvo para as próximas compras.</p>
    <div id="baseList"></div>
    <form class="add" id="baseForm" autocomplete="off" style="margin-top:20px">
      <input class="name" id="bName" placeholder="Novo item fixo da lista" required maxlength="80" aria-label="Nome do item fixo">
      <select id="bSector" aria-label="Setor"></select>
      <div class="row">
        <input id="bQty" type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="Quantidade">
        <input id="bPrice" inputmode="decimal" placeholder="Preço un. (R$)" aria-label="Preço unitário">
        <button class="primary" type="submit">Salvar na base</button>
      </div>
    </form>
  </div>
</div>

<div class="budget" id="budget">
  <div class="in">
    <div class="btop">
      <span class="spent" id="bSpent">R$ 0,00</span>
      <span class="of" id="bOf">no carrinho</span>
    </div>
    <div class="bar"><div class="fill" id="bFill" style="width:0"></div><div class="plan" id="bPlan" hidden></div></div>
    <div class="bfoot"><span id="bPlanned"></span><span id="bLeft"></span></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="login" id="login" hidden>
  <form class="login-card" id="nameForm" autocomplete="off">
    <h1>Lista do mercado</h1>
    <p>Como você se chama? Seu nome aparece para os outros quando você pega um item.</p>
    <input id="myName" maxlength="30" required placeholder="Seu nome" aria-label="Seu nome">
    <button class="primary" type="submit">Entrar na lista</button>
    <p class="of" id="loginMsg"></p>
  </form>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h3>Orçamento da compra</h3>
    <label for="sName">Nome da lista</label>
    <input id="sName" maxlength="40">
    <label for="sBudget">Quanto vocês podem gastar (R$)</label>
    <input id="sBudget" inputmode="decimal" placeholder="Ex.: 600">
    <div class="acts">
      <button class="ghost" type="button" id="copyLink" style="margin-right:auto">Copiar link</button>
      <button class="ghost" value="cancel" type="submit">Cancelar</button>
      <button class="primary" value="save" type="submit" style="grid-column:auto">Salvar</button>
    </div>
  </form>
</dialog>

<script type="module">
import { firebaseConfig, LIST_ID } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const SECTORS = [
  {id:"hortifruti", name:"Hortifrúti", c:"#3B8E3B"},
  {id:"acougue", name:"Açougue", c:"#B83227"},
  {id:"frios", name:"Frios e laticínios", c:"#2F6AAB"},
  {id:"padaria", name:"Padaria", c:"#B07A12"},
  {id:"mercearia", name:"Mercearia", c:"#C85A17"},
  {id:"congelados", name:"Congelados", c:"#2A8BB8"},
  {id:"bebidas", name:"Bebidas", c:"#7346B8"},
  {id:"limpeza", name:"Limpeza", c:"#12878C"},
  {id:"higiene", name:"Higiene", c:"#C0457B"},
  {id:"pet", name:"Pet", c:"#7D5F40"},
  {id:"outros", name:"Outros", c:"#64736C"}
];
const SECTOR = Object.fromEntries(SECTORS.map(s => [s.id, s]));
const brl = new Intl.NumberFormat("pt-BR", {style:"currency", currency:"BRL"});
const $ = id => document.getElementById(id);

let db = null, user = null, me = null;
let items = [];
let config = {budget:0, name:"Lista do mercado"};
let filter = "all";
let local = true;
let firstItemsSnap = true;
let canWrite = true;
let editingPrice = null;
let prices = {};
function keyFor(name){ return (name || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 150) || "item"; }
let template = [];
let tab = "compra";
let editingBase = null;
let q = "";
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
function refPrice(name){
  const k = keyFor(name);
  if (prices[k]) return prices[k];
  const t = template.find(x => x.id === k && x.price);
  return t ? {name:t.name, price:t.price, sector:t.sector, source:t.source || "estimativa"} : null;
}
function updateKnown(){
  const names = new Set([...Object.values(prices).map(p => p.name), ...template.map(t => t.name)]);
  $("known").replaceChildren(...[...names].filter(Boolean).map(n => h("option", {value:n})));
}
async function savePrice(name, price, sector, source){
  if (!price) return;
  const k = keyFor(name);
  const rec = {name, price, sector, source, updatedAt: Date.now()};
  prices[k] = rec;
  if (local) return;
  try{ await db.doc("prices/" + k).set(rec); }catch(e){}
}

function h(tag, props = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)){
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) el.append(kid);
  return el;
}
function parseMoney(s){
  if (s == null) return 0;
  s = String(s).trim().replace(/[R$\s]/g, "");
  if (!s) return 0;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : 0;
}
let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}
function notice(msg){
  const n = $("notice");
  if (!msg){ n.hidden = true; return; }
  n.textContent = msg; n.hidden = false;
}

/* ---------- Sector select ---------- */
for (const s of SECTORS){
  $("fSector").append(h("option", {value:s.id, text:s.name}));
  $("bSector").append(h("option", {value:s.id, text:s.name}));
}

/* ---------- Render ---------- */
function render(){
  $("title").textContent = config.name || "Lista do mercado";
  const total = items.length, done = items.filter(i => i.done).length;
  $("progress").textContent = total ? `${done} de ${total} itens no carrinho` : "Lista vazia";

  const list = $("list");
  list.replaceChildren();
  const qn = norm(q);
  const visible = qn ? items.filter(i => norm(i.name).includes(qn)) : (filter === "todo" ? items.filter(i => !i.done) : items);

  if (!visible.length && qn){
    const have = new Set(items.map(i => keyFor(i.name)));
    const sug = template.filter(t => norm(t.name).includes(qn) && !have.has(t.id)).slice(0, 6);
    const box = h("div", {class:"empty-state"},
      h("strong", {text:`“${q.trim()}” não está na compra de hoje`}),
      h("span", {text: sug.length ? "Está na lista base. Toque para adicionar:" : "Ninguém adicionou esse item ainda."}));
    if (canWrite){
      const row = h("div", {class:"suggest"});
      for (const t of sug) row.append(h("button", {class:"addone", type:"button", onclick: async () => { await addFromTemplate([t]); clearSearch(); toast(`${t.name} adicionado à compra`); }, text:`+ ${t.name}`}));
      if (!sug.length) row.append(h("button", {class:"primary", type:"button", style:"grid-column:auto", onclick: () => addFromSearch(q.trim()), text:"Adicionar à compra"}));
      box.append(row);
    }
    list.append(box);
  } else if (!visible.length){
    list.append(h("div", {class:"empty-state"},
      h("strong", {text: total ? "Tudo no carrinho" : "Nada na lista ainda"}),
      h("span", {text: total ? "Não falta nenhum item. Boa compra!" : "Adicione o primeiro item acima e escolha o setor."})
    ));
  }

  const uids = new Set();
  for (const s of SECTORS){
    const group = visible.filter(i => (SECTOR[i.sector] ? i.sector : "outros") === s.id);
    if (!group.length) continue;
    group.sort((a, b) => (a.done - b.done) || ((a.createdAt || 0) - (b.createdAt || 0)));
    const all = items.filter(i => (SECTOR[i.sector] ? i.sector : "outros") === s.id);
    const ul = h("ul", {class:"shelf"});
    for (const it of group){
      if (it.done && it.doneBy) uids.add(it.doneBy);
      ul.append(itemRow(it));
    }
    list.append(h("section", {class:"aisle", style:`--c:${s.c}`},
      h("div", {class:"sign"}, h("h2", {text:s.name}), h("span", {text:`${all.filter(i=>i.done).length}/${all.length}`})),
      ul
    ));
  }
  $("tools").hidden = !total || !canWrite;
  $("addForm").hidden = !canWrite;
  renderBudget();
  renderBase();
  if (uids.size) fillNames([...uids]);
}

function itemRow(it){
  const qty = Math.max(1, it.qty || 1);
  const metaKids = [];
  metaKids.push(h("span", {text: qty > 1 ? `${qty} un.` + (it.price ? ` × ${brl.format(it.price)}` : "") : (it.price ? "1 un." : "")}));
  const SRC = {assai:"preço Assaí", compra:"última compra", estimativa:"estimativa"};
  if (it.price && SRC[it.priceSource]) metaKids.push(h("span", {class:"src", text: SRC[it.priceSource]}));
  if (it.done){
    const who = h("span", {class:"who", "data-uid": it.doneBy || ""});
    who.append(h("span", {text: it.doneBy && it.doneBy === me ? "Você pegou" : "Já pego"}));
    metaKids.push(who);
  }
  let priceEl;
  if (editingPrice === it.id){
    priceEl = h("input", {class:"price-in", inputmode:"decimal", value: it.price ? String(it.price).replace(".", ",") : "", "aria-label":"Preço unitário"});
    const commit = () => { editingPrice = null; const v = parseMoney(priceEl.value); if (v !== (it.price || 0)) setPrice(it, v); else render(); };
    priceEl.addEventListener("blur", commit);
    priceEl.addEventListener("keydown", e => { if (e.key === "Enter") priceEl.blur(); if (e.key === "Escape"){ editingPrice = null; render(); } });
    setTimeout(() => { priceEl.focus(); priceEl.select(); }, 0);
  } else {
    const line = (it.price || 0) * qty;
    priceEl = h("button", {class:"price" + (line ? "" : " empty"), type:"button", "aria-label":`Preço de ${it.name}`,
      onclick: () => { if (!canWrite) return; editingPrice = it.id; render(); },
      text: line ? brl.format(line) : "+ preço"});
  }
  return h("li", {class:"item" + (it.done ? " done" : "")},
    h("button", {class:"check", type:"button", "aria-pressed": it.done ? "true" : "false", "aria-label": (it.done ? "Desmarcar " : "Marcar ") + it.name, onclick: () => toggle(it)},
      h("i", {}, svgCheck())),
    h("div", {class:"info", onclick: () => toggle(it)}, h("b", {text: it.name}), h("div", {class:"meta"}, ...metaKids)),
    h("div", {class:"right"}, priceEl,
      canWrite ? h("button", {class:"del", type:"button", "aria-label":`Remover ${it.name}`, onclick: () => removeItem(it), text:"×"}) : null)
  );
}
function svgCheck(){
  const ns = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(ns, "svg"); s.setAttribute("viewBox", "0 0 16 16");
  const p = document.createElementNS(ns, "path");
  p.setAttribute("d", "M3 8.5l3.2 3L13 4.5"); p.setAttribute("fill", "none"); p.setAttribute("stroke", "#fff"); p.setAttribute("stroke-width", "2.4"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
  s.append(p); return s;
}

async function fillNames(ids){
  if (!user) return;
  try{
    const ps = await user.profiles(ids);
    document.querySelectorAll(".who[data-uid]").forEach(el => {
      const id = el.getAttribute("data-uid"); const p = ps[id];
      if (!p) return;
      const first = (p.name || "").split(" ")[0];
      const img = h("img", {src:p.avatarUrl, alt:""});
      const label = h("span", {text: p.isMe ? "Você pegou" : (first ? `${first} pegou` : "Já pego")});
      el.replaceChildren(img, label);
    });
  }catch(e){}
}

function renderBudget(){
  let spent = 0, planned = 0, missingPrice = 0;
  for (const it of items){
    const line = (it.price || 0) * Math.max(1, it.qty || 1);
    planned += line;
    if (it.done) spent += line;
    if (!it.price) missingPrice++;
  }
  const b = config.budget || 0;
  $("bSpent").textContent = brl.format(spent);
  const el = $("budget");
  el.classList.remove("warn", "over");
  if (b > 0){
    $("bOf").textContent = `no carrinho de ${brl.format(b)}`;
    $("bFill").style.width = Math.min(100, spent / b * 100) + "%";
    const plan = $("bPlan"); plan.hidden = false; plan.style.left = Math.min(99.5, planned / b * 100) + "%";
    const left = b - spent;
    $("bLeft").replaceChildren(left >= 0
      ? h("span", {}, "Sobram ", h("b", {text: brl.format(left)}))
      : h("span", {}, "Passou ", h("b", {text: brl.format(-left)})));
    if (spent > b) el.classList.add("over");
    else if (planned > b) el.classList.add("warn");
  } else {
    $("bOf").textContent = "no carrinho";
    $("bFill").style.width = planned ? Math.min(100, spent / planned * 100) + "%" : "0";
    $("bPlan").hidden = true;
    $("bLeft").textContent = "Defina um orçamento";
  }
  const pl = h("span", {}, "Previsto ", h("b", {text: brl.format(planned)}));
  if (missingPrice) pl.append(` · ${missingPrice} sem preço`);
  $("bPlanned").replaceChildren(pl);
}

function newId(){ return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

async function addItem(data){
  if (local){ items.push({id:newId(), ...data}); render(); return; }
  try{ await db.collection("items").add(data); }
  catch(e){ handleWriteError(e, "adicionar o item"); }
}
async function toggle(it){
  if (!canWrite) return;
  const next = it.done ? {done:false, doneBy:null, doneAt:null} : {done:true, doneBy:me, doneAt:Date.now()};
  if (!it.done && navigator.vibrate) navigator.vibrate(15);
  if (local){ Object.assign(it, next); render(); return; }
  try{ await db.doc("items/" + it.id).update(next); }
  catch(e){ handleWriteError(e, "marcar o item"); }
}
async function setPrice(it, price){
  savePrice(it.name, price, it.sector, "compra");
  const tpl = template.find(x => x.id === keyFor(it.name));
  if (tpl && price){
    if (local) Object.assign(tpl, {price, source:"compra"});
    else db.doc("template/" + tpl.id).update({price, source:"compra"}).catch(() => {});
  }
  if (local){ it.price = price; it.priceSource = "manual"; render(); return; }
  try{ await db.doc("items/" + it.id).update({price, priceSource:"manual"}); }
  catch(e){ handleWriteError(e, "salvar o preço"); }
}
async function removeItem(it){
  if (local){ items = items.filter(x => x !== it); render(); return; }
  try{ await db.doc("items/" + it.id).delete(); }
  catch(e){ handleWriteError(e, "remover o item"); }
}
async function bulk(list, fn){
  for (const it of list){ await fn(it); }
}
function handleWriteError(e, what){
  if (e && (e.code === "invalid_argument" || e.code === "permission-denied")){ canWrite = false; notice("Não foi possível salvar. Recarregue a página e tente de novo."); render(); return; }
  if (e && e.code === "quota_exceeded"){ toast("A lista atingiu o limite de itens. Remova os itens já pegos."); return; }
  toast(`Não deu para ${what}. Verifique a conexão e tente de novo.`);
}

function renderBase(){
  const list = $("baseList");
  list.replaceChildren();
  $("baseForm").hidden = !canWrite;
  $("addAllBase").hidden = !canWrite || !template.length;
  const have = new Set(items.map(i => keyFor(i.name)));
  const qb = norm(q);
  let shown = 0;
  let total = 0;
  for (const t of template) total += (t.price || 0) * Math.max(1, t.qty || 1);
  $("baseTotal").textContent = brl.format(total);
  $("baseCount").textContent = template.length ? `${template.length} itens, total estimado` : "Nenhum item fixo ainda";
  if (!template.length){
    list.append(h("div", {class:"empty-state"}, h("strong", {text:"Lista base vazia"}), h("span", {text:"Cadastre abaixo os itens que vocês compram sempre."}),
      canWrite && !local ? h("div", {style:"margin-top:14px"}, h("button", {class:"primary", type:"button", style:"grid-column:auto", onclick: seedTemplate, text:"Carregar lista base padrão"})) : null));
    return;
  }
  for (const s of SECTORS){
    const group = template.filter(t => (SECTOR[t.sector] ? t.sector : "outros") === s.id && (!qb || norm(t.name).includes(qb))).sort((a, b) => (a.order || 0) - (b.order || 0));
    shown += group.length;
    if (!group.length) continue;
    const sub = group.reduce((a, t) => a + (t.price || 0) * Math.max(1, t.qty || 1), 0);
    const ul = h("ul", {class:"shelf"});
    for (const t of group) ul.append(baseRow(t, have.has(t.id)));
    list.append(h("section", {class:"aisle", style:`--c:${s.c}`},
      h("div", {class:"sign"}, h("h2", {text:s.name}), h("span", {text:brl.format(sub)})), ul));
  }
  if (typeof SEED !== "undefined" && canWrite && !local && !qb){
    const have2 = new Set(template.map(t => t.id));
    const faltam = SEED.filter(t => !have2.has(t.id)).length;
    if (faltam) list.append(h("div", {style:"text-align:center;margin-top:16px"}, h("button", {class:"ghost", type:"button", onclick: () => seedTemplate(), text:`Carregar itens padrão que faltam (${faltam})`})));
  }
  if (qb && !shown) list.append(h("div", {class:"empty-state"}, h("strong", {text:`“${q.trim()}” não está na lista base`}), h("span", {text:"Cadastre abaixo para ele aparecer nas próximas compras."})));

    const commit = () => { if (editingBase !== t.id) return; editingBase = null; const v = parseMoney(priceEl.value); if (v !== (t.price || 0)){ updateTemplate(t, {price:v, source:"compra"}); savePrice(t.name, v, t.sector, "compra"); } else render(); };
    priceEl.addEventListener("blur", commit);

const BASE = "lists/" + LIST_ID + "/";
async function seedTemplate(){
  const have = new Set(template.map(t => t.id));
  const missing = SEED.filter(t => !have.has(t.id));
  if (!missing.length){ toast("A lista base já tem todos os itens padrão."); return; }
  if (!confirm(`Carregar ${missing.length} ${missing.length > 1 ? "itens" : "item"} na lista base?`)) return;
  try{
    const batch = writeBatch(fs);
    for (const t of missing){ const {id, ...rec} = t; batch.set(doc(fs, BASE + "template/" + id), rec); }
    await batch.commit();
    toast(`${missing.length} ${missing.length > 1 ? "itens carregados" : "item carregado"} na lista base`);
  }catch(e){ handleWriteError(e, "carregar a lista base"); }
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const fs = getFirestore(app);
let members = {};
const blankAvatar = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#8aa197"/></svg>');
function savedName(){ try{ return localStorage.getItem("lista-mercado-nome") || ""; }catch(e){ return ""; } }

// Mesma API que o app já usava, agora em cima do Firestore
const wrapDoc = p => ({
  update: d => updateDoc(doc(fs, BASE + p), d),
  set: d => setDoc(doc(fs, BASE + p), d),
  delete: () => deleteDoc(doc(fs, BASE + p)),
  onSnapshot: (next, err) => onSnapshot(doc(fs, BASE + p), snap => next({id: snap.id, exists: snap.exists(), data: () => snap.data(), metadata: snap.metadata}), err)
});
const wrapCol = (p, cons = []) => ({
  add: d => addDoc(collection(fs, BASE + p), d),
  orderBy: (f, dir) => wrapCol(p, [...cons, orderBy(f, dir || "asc")]),
  limit: n => wrapCol(p, [...cons, limit(n)]),
  onSnapshot: (next, err) => onSnapshot(query(collection(fs, BASE + p), ...cons), next, err)
});

$("copyLink").addEventListener("click", async () => {
  try{ await navigator.clipboard.writeText(location.origin + location.pathname); toast("Link copiado. Quem tiver o link pode editar a lista."); }
  catch(e){ toast(location.origin + location.pathname); }
});
$("nameForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("myName").value.trim();
  if (!name) return;
  try{ localStorage.setItem("lista-mercado-nome", name); }catch(err){}
  $("login").hidden = true;
  start(name);
});

let started = false;
render();
signInAnonymously(auth).catch(() => notice("Não foi possível conectar à lista. Verifique a internet e recarregue a página."));
onAuthStateChanged(auth, account => {
  if (!account) return;
  me = account.uid;
  const name = savedName();
  if (name) start(name);
  else { $("login").hidden = false; setTimeout(() => $("myName").focus(), 50); }
});

function start(myName){
  if (started || !me) return;
  started = true;
  local = false;
  db = { doc: wrapDoc, collection: p => wrapCol(p) };
  user = {
    profiles: async ids => Object.fromEntries((Array.isArray(ids) ? ids : [ids]).map(id => [id, {
      id, name: (members[id] && members[id].name) || "", avatarUrl: blankAvatar, isMe: id === me
    }]))
  };
  setDoc(doc(fs, BASE + "members/" + me), {name: myName}, {merge: true}).catch(() => {});

  db.collection("members").onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) next[d.id] = d.data();
    members = next;
    if (!editingBase && !editingPrice) render();
  }, () => {});

  db.doc("config/main").onSnapshot(snap => {
    if (snap.exists){ const d = snap.data(); config = {name: d.name || "Lista do mercado", budget: Number(d.budget) || 0}; }
    render();
  }, () => {});

  db.collection("prices").limit(1000).onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) next[d.id] = d.data();
    prices = next;
    updateKnown();
  }, () => {});

  db.collection("template").limit(500).onSnapshot(snap => {
    template = snap.docs.map(d => ({id: d.id, ...d.data()}));
    updateKnown();
    if (!editingBase && !editingPrice) render();
  }, () => {});

  db.collection("items").orderBy("createdAt").limit(1000).onSnapshot(async snap => {
    const announce = [];
    if (!firstItemsSnap){
      for (const ch of snap.docChanges()){
        if (ch.type !== "modified" || ch.doc.metadata.hasPendingWrites) continue;
        const d = ch.doc.data();
        const prev = items.find(i => i.id === ch.doc.id);
        if (d.done && prev && !prev.done && d.doneBy && d.doneBy !== me) announce.push(d);
      }
    }
    firstItemsSnap = false;
    items = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if (editingPrice && !items.some(i => i.id === editingPrice)) editingPrice = null;
    if (!editingPrice && !editingBase) render(); else renderBudget();
    for (const d of announce){
      let who = "Alguém";
      try{ const ps = await user.profiles([d.doneBy]); who = (ps[d.doneBy].name || "").split(" ")[0] || "Alguém"; }catch(e){}
      toast(`${who} pegou ${d.name}`);
      if (navigator.vibrate) navigator.vibrate([20, 60, 20]);
    }
  }, err => {
    notice("A sincronização parou. Recarregue a página para voltar a ver as mudanças dos outros.");
  });

}
